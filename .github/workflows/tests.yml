name: tests

# Trigger: push / PR to main. Run the "desktop-independent unit tests" in CI before
# releasing, so problems like "version parsing is wrong", "payload path traversal" or
# "image finding fails after a scaling change" never reach a Release.
#
# Only pure logic tests run here: no real screen capture, no real mouse injection, no
# network (all network calls are mocked).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout main app
        uses: actions/checkout@v4

      # The installer repo has its own test suite (version parsing / payload replace-rollback / native_ui).
      # It is pulled from main like the release job: the contract constants on both sides must match.
      - name: Checkout installer
        uses: actions/checkout@v4
        with:
          repository: mmccz/MaaAuto-Installer
          ref: main
          path: installer

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            MaaAutoProject/requirements.txt
            installer/MaaAutoInstaller/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MaaAutoProject/requirements.txt
          pip install -r installer/MaaAutoInstaller/requirements.txt
          pip install pytest

      # vision.py needs cv2; missing it degrades silently, so assert it up front.
      - name: Verify test prerequisites
        shell: pwsh
        run: |
          python --version
          python -c "import cv2, numpy, PIL, psutil, PySide6; print('deps ok')"

      - name: Run main-app tests
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests -q --junitxml=pytest-main.xml
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run installer tests
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          Push-Location installer
          python -m pytest tests -q --junitxml=../pytest-installer.xml
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-main.xml
            pytest-installer.xml
          if-no-files-found: ignore
