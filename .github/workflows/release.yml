name: release

# 触发：推送 v* tag，或手动指定 tag。
# 注意：workflow 必须在「tag 所在的仓库」里 —— Release 与 tag 都在主程序仓库，
# 所以这里构建两个仓库的产物并上传到本仓库的 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（例如 v1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout main app
        uses: actions/checkout@v4

      - name: Checkout installer
        uses: actions/checkout@v4
        with:
          repository: mmccz/MaaAuto-Installer
          ref: main
          path: installer

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MaaAutoProject/requirements.txt
          pip install pyinstaller
          pip install -r installer/MaaAutoInstaller/requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Verify build tools
        shell: pwsh
        run: |
          python --version
          python -c "import PyInstaller, PySide6, psutil; print('deps ok')"
          'ISCC 候选路径：' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | ForEach-Object {
            "{0} => {1}" -f $_, (Test-Path $_) | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }

      # 不传 --iscc：choco / winget 的安装位置不一样，交给脚本自动探测。
      - name: Build release assets
        shell: pwsh
        run: |
          python installer/MaaAutoInstaller/build_release.py --source-dir MaaAutoProject --delta-auto 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "## 构建失败，最后 60 行日志" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content build.log -Tail 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }

      # 发布前的最后一道保险：在干净 runner 上真的装一遍 → 查产物与 manifest → 卸干净。
      # 装不上 / manifest 版本不对 / 卸载残留 → 红在这里，绝不会把半成品发出去。
      - name: Smoke test installer
        shell: pwsh
        run: |
          python installer/MaaAutoInstaller/tools/smoke_install.py "${{ env.TAG }}" 2>&1 |
            Tee-Object -FilePath smoke.log
          if ($LASTEXITCODE -ne 0) {
            "## 安装/卸载 smoke 失败，最后 60 行" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content smoke.log -Tail 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }

      # 失败时把构建日志推到独立分支 ci-logs（不污染 main），便于排查。
      - name: Publish failure log
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { 'no build.log' | Out-File build.log -Encoding utf8 }
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B ci-logs
          Copy-Item build.log ci-last.log -Force
          if (Test-Path smoke.log) {
            "`n===== smoke.log =====" | Out-File -Append -Encoding utf8 ci-last.log
            Get-Content smoke.log -Raw | Out-File -Append -Encoding utf8 ci-last.log
          }
          git add -f ci-last.log
          git commit -m "ci log ${{ github.run_id }}"
          git push --force origin ci-logs

      - name: Collect assets
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item installer/dist/MaaAuto_Setup_*.exe out/
          Copy-Item installer/dist/MaaAuto_Online_*.exe out/
          Copy-Item installer/dist/MaaAuto_payload_*.zip out/
          Copy-Item installer/dist/MaaAuto_delta_*.zip out/ -ErrorAction SilentlyContinue
          Copy-Item installer/dist/SHA256SUMS.txt out/
          Get-ChildItem out | Format-Table Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MaaAuto ${{ env.TAG }}
          # 发布说明直接取仓库里的 RELEASE_NOTES.md（每次发版同步更新这个文件）。
          body_path: RELEASE_NOTES.md
          # 预发布（tag 含 b / rc / beta）：自动发布为 prerelease，beta 渠道才能拉到；
          # 正式版同样直接发布 —— 构建失败时前面的步骤会 exit 1，不会产生半成品 Release。
          prerelease: ${{ contains(env.TAG, 'b') || contains(env.TAG, 'rc') || contains(env.TAG, 'beta') }}
          draft: false
          generate_release_notes: false
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
