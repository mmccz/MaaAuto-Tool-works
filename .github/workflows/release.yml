name: release

# Trigger: push a v* tag, or pass a tag manually.
# Note: the workflow must live in the repo that owns the tag -- both the Release and the
# tag are in the main app repo, so build both repos' artifacts here and upload them to this repo's Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（例如 v1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout main app
        uses: actions/checkout@v4

      - name: Checkout installer
        uses: actions/checkout@v4
        with:
          repository: mmccz/MaaAuto-Installer
          ref: main
          path: installer

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MaaAutoProject/requirements.txt
          pip install pyinstaller
          pip install -r installer/MaaAutoInstaller/requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Verify build tools
        shell: pwsh
        run: |
          python --version
          python -c "import PyInstaller, PySide6, psutil; print('deps ok')"
          'ISCC 候选路径：' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | ForEach-Object {
            "{0} => {1}" -f $_, (Test-Path $_) | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }

      # No --iscc passed on purpose: choco / winget install locations differ, let the script auto-detect.
      - name: Build release assets
        shell: pwsh
        run: |
          python installer/MaaAutoInstaller/build_release.py --source-dir MaaAutoProject --delta-auto 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "## 构建失败，最后 60 行日志" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content build.log -Tail 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }

      # Last safety net before publishing: really install on a clean runner -> check artifacts and manifest -> uninstall cleanly.
      # Install fails / wrong manifest version / uninstall leftovers -> red here, so a half-built release never ships.
      - name: Smoke test installer
        shell: pwsh
        run: |
          python installer/MaaAutoInstaller/tools/smoke_install.py "${{ env.TAG }}" 2>&1 |
            Tee-Object -FilePath smoke.log
          if ($LASTEXITCODE -ne 0) {
            "## 安装/卸载 smoke 失败，最后 60 行" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content smoke.log -Tail 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }

      # On failure, push the build log to a separate ci-logs branch (keeps main clean) for debugging.
      - name: Publish failure log
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { 'no build.log' | Out-File build.log -Encoding utf8 }
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B ci-logs
          Copy-Item build.log ci-last.log -Force
          if (Test-Path smoke.log) {
            "`n===== smoke.log =====" | Out-File -Append -Encoding utf8 ci-last.log
            Get-Content smoke.log -Raw | Out-File -Append -Encoding utf8 ci-last.log
          }
          git add -f ci-last.log
          git commit -m "ci log ${{ github.run_id }}"
          git push --force origin ci-logs

      - name: Collect assets
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item installer/dist/MaaAuto_Setup_*.exe out/
          Copy-Item installer/dist/MaaAuto_Online_*.exe out/
          Copy-Item installer/dist/MaaAuto_payload_*.zip out/
          Copy-Item installer/dist/MaaAuto_delta_*.zip out/ -ErrorAction SilentlyContinue
          Copy-Item installer/dist/SHA256SUMS.txt out/
          Get-ChildItem out | Format-Table Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MaaAuto ${{ env.TAG }}
          # Release body comes straight from RELEASE_NOTES.md in the repo (kept in sync on every release).
          body_path: RELEASE_NOTES.md
          # Prerelease (tag contains b / rc / beta): published as prerelease automatically so the beta channel can pull it;
          # stable releases are published directly too -- any build failure makes earlier steps exit 1, so no half-built Release appears.
          prerelease: ${{ contains(env.TAG, 'b') || contains(env.TAG, 'rc') || contains(env.TAG, 'beta') }}
          draft: false
          generate_release_notes: false
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
